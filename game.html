<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxel Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d10; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; color: #e8e8e8; user-select: none; }

    #game { position: fixed; inset: 0; }
    #game canvas { display: block; }

    /* --- overlays --- */
    .overlay { position: fixed; pointer-events: none; z-index: 10; }
    .hidden { display: none !important; }

    /* --- HUD ---
       Minecraft-style bottom bar: stats (HP/AP bars + hand) in a pill above a
       row holding the equipment hotbar and the big ammo readout to its right,
       centered at the bottom like the editor's toolbar. On touch screens the
       touch layer owns the hotbar, so the HUD drops back to a compact top-left
       readout without the slots. */
    #hud { top: auto; left: 50%; bottom: 14px; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px; }
    #hud .stats {
      display: flex; align-items: center; gap: 14px;
      padding: 7px 12px; border-radius: 10px;
      background: rgba(0,0,0,0.45);
    }
    #hud .row { display: flex; align-items: center; gap: 5px; font-size: 12px; }
    #hud .label { opacity: 0.7; }
    #hud .value { font-variant-numeric: tabular-nums; }

    /* stats bars */
    .bar { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .bar .bar-label { width: 20px; opacity: 0.8; }
    .bar .bar-track { width: 120px; height: 14px; border-radius: 7px; background: rgba(255,255,255,0.12); overflow: hidden; }
    .bar .bar-fill { display: block; height: 100%; width: 100%; border-radius: 7px; transition: width 0.15s; }
    .bar .bar-fill.health { background: linear-gradient(90deg, #c33, #e66); }
    .bar .bar-fill.health.low { background: linear-gradient(90deg, #711, #c33); }
    .bar .bar-fill.armor { background: linear-gradient(90deg, #36a, #6ae); }
    .bar .bar-num { min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.9; }

    /* bottom row: hotbar + ammo */
    #hud-row { display: flex; align-items: center; gap: 14px; }

    /* equipment slots (bottom hotbar, styled like the editor's toolbar) */
    #equipment { display: flex; gap: 8px; }
    .eq-slot {
      position: relative; width: 56px; height: 56px; padding: 4px;
      border: 2px solid rgba(255,255,255,0.15); border-radius: 8px;
      background: rgba(30,34,40,0.9);
      display: flex; align-items: center; justify-content: center;
      text-align: center; cursor: pointer; pointer-events: auto;
    }
    .eq-slot:hover { border-color: rgba(255,255,255,0.4); }
    .eq-slot.active { border-color: #6cf; box-shadow: 0 0 8px rgba(102,204,255,0.5); }
    .eq-slot canvas { image-rendering: pixelated; width: 100%; height: 100%; }
    .eq-slot-name { font-size: 11px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
    .eq-slot-label { position: absolute; top: 2px; right: 5px; font-size: 10px; opacity: 0.55; }
    #hand { font-size: 12px; opacity: 0.85; }

    /* ammo readout: big, next to the hotbar, outside the dark stats pill */
    #ammo {
      font-size: 30px; font-weight: 700; color: #ffd9d9;
      font-variant-numeric: tabular-nums; line-height: 1.1;
      min-width: 140px; text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.85);
    }

    /* touch screens: touch layer owns the hotbar, so keep only a small
       top-left stats readout (health/armor/ammo) — no duplicate slots */
    @media (pointer: coarse) {
      #hud { top: 12px; left: 12px; bottom: auto; transform: none; align-items: flex-start; }
      #hud #equipment { display: none; }
      #hud .stats { flex-wrap: wrap; gap: 6px 14px; max-width: 46vw; }
      .bar .bar-track { width: 90px; }
      #ammo { font-size: 20px; min-width: 0; }
    }

    #crosshair { left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.85);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
    #crosshair::after  { left: 0; top: 8px; width: 18px; height: 2px; }

    #toast {
      left: 50%; top: calc(50% + 30px); transform: translateX(-50%);
      padding: 6px 14px; border-radius: 20px; background: rgba(0,0,0,0.5);
      font-size: 14px; opacity: 0; transition: opacity 0.15s;
    }
    #toast.show { opacity: 1; }

    /* hit feedback: a red vignette + slight blur that flashes on every hit the
       player takes (wired in GameApp._mobHitsPlayer via body.hurt). Intensity
       scales with missing health: the CSS variables --hit-int / --hit-blur /
       --hit-stop (set by _hitFlash) peak higher, blur harder and cover more of
       the screen the lower your HP is. Both decay to nothing over half a
       second; the hurt class is cleared when the animation ends. */
    #hit-feedback {
      position: fixed; inset: 0; z-index: 8; pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at center, transparent var(--hit-stop, 55%), rgba(200,10,10,0.5) 100%);
    }
    body.hurt #hit-feedback { animation: hit-vignette 0.5s ease-out forwards; }
    body.hurt #game canvas { animation: hit-blur 0.5s ease-out forwards; }
    @keyframes hit-vignette {
      from { opacity: var(--hit-int, 0.7); }
      to { opacity: 0; }
    }
    @keyframes hit-blur {
      from { filter: blur(var(--hit-blur, 2px)); }
      to { filter: blur(0px); }
    }

    /* pickup prompt (aiming at a placed equippable item) */
    #pickup {
      left: 50%; top: calc(50% + 26px); transform: translateX(-50%);
      padding: 5px 14px; border-radius: 20px; background: rgba(0,0,0,0.55);
      border: 1px solid rgba(102,204,255,0.6); color: #bfe9ff; font-size: 14px;
      white-space: nowrap;
    }
    #pickup kbd {
      display: inline-block; min-width: 20px; padding: 0 5px; border: 1px solid #6cf;
      border-bottom-width: 2px; border-radius: 4px; background: rgba(0,0,0,0.4);
      font-family: inherit; font-size: 12px; color: #fff;
    }

    /* --- menus --- */
    .screen {
      position: fixed; inset: 0; z-index: 20; display: flex;
      align-items: center; justify-content: center; background: rgba(0,0,0,0.55);
      pointer-events: auto;
    }
    .screen.hidden { display: none; }
    .screen .box {
      background: rgba(14,17,22,0.96); border: 1px solid #333; border-radius: 12px;
      padding: 28px 34px; min-width: 340px; max-width: 90vw; text-align: center;
    }
    .screen h1 { font-size: 24px; margin-bottom: 6px; }
    .screen .sub { opacity: 0.7; font-size: 13px; margin-bottom: 20px; }
    .screen h2 { font-size: 14px; margin: 18px 0 8px; color: #fcb; text-align: left; }
    .screen button {
      display: block; width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #3a3f47;
      border-radius: 8px; background: rgba(30,36,44,0.9); color: #e8e8e8; cursor: pointer;
      font-size: 14px;
    }
    .screen button:hover:not(:disabled) { background: rgba(50,58,70,0.95); }
    .screen button:disabled { opacity: 0.4; cursor: default; }
    .screen button.primary { border-color: #6c9; background: rgba(60,110,80,0.5); }
    .screen button.primary:hover { background: rgba(70,130,95,0.7); }
    .screen .slot-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; text-align: left; }
    .screen .slot-row span { flex: 1; font-size: 13px; opacity: 0.9; }
    .screen .slot-row button { width: auto; margin: 0; padding: 6px 14px; }
    .screen .hint { margin-top: 18px; font-size: 12px; opacity: 0.6; line-height: 1.7; }
    .screen kbd {
      display: inline-block; min-width: 20px; padding: 0 5px; border: 1px solid #555;
      border-bottom-width: 2px; border-radius: 4px; background: #1a1c20; font-family: inherit; font-size: 12px;
    }

    /* --- touch controls (mobile only) ---
       Minecraft-style: floating joystick on the left, drag-to-look on the
       right, fire/pickup bottom-right, crouch bottom-left. Hidden on desktop
       (fine pointer). */
    #touch-layer {
      position: fixed; inset: 0; z-index: 5; display: none;
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    @media (pointer: coarse) { #touch-layer { display: block; } }
    #touch-layer.hidden { display: none !important; }

    .tc-btn {
      position: absolute; border: 1px solid rgba(255,255,255,0.28); border-radius: 50%;
      background: rgba(20,26,32,0.6); color: #fff; display: flex; align-items: center;
      justify-content: center; text-align: center; line-height: 1.1; font-weight: 600;
      font-family: inherit; font-size: 13px; letter-spacing: 0.02em;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    .tc-btn:active, .tc-btn.on { background: rgba(90,140,190,0.75); border-color: rgba(255,255,255,0.6); }

    #btn-attack { right: 14px; bottom: 16px; width: 84px; height: 84px; font-size: 16px;
      border-color: rgba(255,120,120,0.55); }
    #btn-pickup { right: 106px; bottom: 24px; width: 60px; height: 60px; }
    #btn-crouch { left: 14px; bottom: 24px; width: 60px; height: 60px; }

    #slots-mobile { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px;
      display: flex; gap: 8px; }
    .slot-btn {
      width: 52px; height: 52px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.28);
      background: rgba(20,26,32,0.6); color: #fff; font-size: 16px; font-weight: 700;
      -webkit-tap-highlight-color: transparent; box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    .slot-btn canvas { image-rendering: pixelated; width: 100%; height: 100%; }
    .slot-btn.active { border-color: #6cf; box-shadow: 0 0 8px rgba(102,204,255,0.5); background: rgba(60,90,130,0.7); }

    #joy-base {
      position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; display: none;
      border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.07);
    }
    #joy-base.visible { display: block; }
    #joy-knob {
      position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px;
      border-radius: 50%; background: rgba(255,255,255,0.4);
    }

    /* portrait phones: raise fire/pickup above the hotbar so they never
       overlap the slot bar (crouch stays bottom-left, clear of it) */
    @media (orientation: portrait) {
      #btn-attack { right: 12px; bottom: 96px; }
      #btn-pickup { right: 100px; bottom: 104px; }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="crosshair" class="overlay"></div>
  <div id="hit-feedback"></div>
  <div id="toast" class="overlay"></div>
  <div id="pickup" class="overlay hidden"></div>

  <div id="hud" class="overlay">
    <div class="stats">
      <div class="bar">
        <span class="bar-label">HP</span>
        <span class="bar-track"><span class="bar-fill health" id="health-fill"></span></span>
        <span class="bar-num" id="health-text">100</span>
      </div>
      <div class="bar">
        <span class="bar-label">AP</span>
        <span class="bar-track"><span class="bar-fill armor" id="armor-fill"></span></span>
        <span class="bar-num" id="armor-text">100</span>
      </div>
      <div id="hand"></div>
    </div>
    <div id="hud-row">
      <div id="equipment"></div>
      <div id="ammo"></div>
    </div>
  </div>

  <div id="menu" class="screen">
    <div class="box">
      <h1>Voxel Game</h1>
      <div class="sub">Your world, built in the editor</div>
      <button id="btn-new" class="primary">New Game</button>
      <h2>Load Game</h2>
      <div id="slots-menu"></div>
      <div class="hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp;·&nbsp;
        <kbd>C</kbd> crouch &nbsp;·&nbsp;
        <kbd>LMB</kbd> attack &nbsp;·&nbsp; <kbd>1</kbd>-<kbd>4</kbd> select equipment &nbsp;·&nbsp;
        <kbd>R</kbd> reload &nbsp;·&nbsp; <kbd>F</kbd> use injection &nbsp;·&nbsp; <kbd>Esc</kbd> pause / save
      </div>
    </div>
  </div>

  <div id="pause" class="screen">
    <div class="box">
      <h1>Paused</h1>
      <div class="sub">Save or load a game slot</div>
      <button id="btn-resume" class="primary">Resume</button>
      <h2>Save / Load</h2>
      <div id="slots-pause"></div>
      <button id="btn-quit">Quit to Menu</button>
    </div>
  </div>

  <div id="death" class="screen hidden">
    <div class="box">
      <h1>You Died</h1>
      <div class="sub">The mobs got you this time</div>
      <button id="btn-respawn" class="primary">Respawn (New Game)</button>
      <button id="btn-death-menu">Main Menu</button>
    </div>
  </div>

  <!-- Mobile touch controls (Minecraft-style): joystick left, look right,
       fire/pickup bottom-right, crouch bottom-left, hotbar bottom-center.
       Wired by TouchControls.js; hidden on desktop by the (pointer: coarse)
       media query. -->
  <div id="touch-layer">
    <button id="btn-attack" class="tc-btn">FIRE</button>
    <button id="btn-pickup" class="tc-btn">PICK</button>
    <button id="btn-crouch" class="tc-btn">CROUCH</button>
    <div id="slots-mobile">
      <button class="slot-btn" data-index="0">1</button>
      <button class="slot-btn" data-index="1">2</button>
      <button class="slot-btn" data-index="2">3</button>
      <button class="slot-btn" data-index="3">4</button>
    </div>
    <div id="joy-base"><div id="joy-knob"></div></div>
  </div>

  <script src="build/game-play.js"></script>
</body>
</html>
