<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxel Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d10; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; color: #e8e8e8; user-select: none; }

    #game { position: fixed; inset: 0; }
    #game canvas { display: block; }

    /* --- overlays --- */
    .overlay { position: fixed; pointer-events: none; z-index: 10; }
    .hidden { display: none !important; }

    #hud { top: 12px; left: 12px; }
    #hud .panel { padding: 8px 10px; border-radius: 8px; background: rgba(0,0,0,0.45); font-size: 13px; margin-bottom: 8px; }
    #hud .row { display: flex; justify-content: space-between; gap: 14px; font-size: 13px; }
    #hud .label { opacity: 0.7; }
    #hud .value { font-variant-numeric: tabular-nums; }

    /* stats bars */
    .bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; }
    .bar .bar-label { width: 18px; opacity: 0.8; }
    .bar .bar-track { flex: 1; height: 12px; border-radius: 6px; background: rgba(255,255,255,0.12); overflow: hidden; }
    .bar .bar-fill { display: block; height: 100%; width: 100%; border-radius: 6px; transition: width 0.15s; }
    .bar .bar-fill.health { background: linear-gradient(90deg, #c33, #e66); }
    .bar .bar-fill.health.low { background: linear-gradient(90deg, #711, #c33); }
    .bar .bar-fill.armor { background: linear-gradient(90deg, #36a, #6ae); }
    .bar .bar-num { min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.9; }

    /* equipment slots */
    #equipment { display: flex; gap: 6px; margin-top: 8px; }
    .eq-slot {
      position: relative; width: 64px; padding: 6px 4px; border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px; background: rgba(20,26,32,0.85); text-align: center; cursor: pointer;
    }
    .eq-slot:hover { border-color: rgba(255,255,255,0.4); }
    .eq-slot.active { border-color: #6cf; box-shadow: 0 0 8px rgba(102,204,255,0.5); }
    .eq-slot-name { display: block; font-size: 11px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .eq-slot-label { position: absolute; top: 2px; right: 4px; font-size: 10px; opacity: 0.55; }
    #hand { margin-top: 6px; font-size: 12px; opacity: 0.85; }
    #ammo { margin-top: 4px; font-size: 13px; font-variant-numeric: tabular-nums; color: #fdd; }

    #crosshair { left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.85);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
    #crosshair::after  { left: 0; top: 8px; width: 18px; height: 2px; }

    #toast {
      left: 50%; top: calc(50% + 30px); transform: translateX(-50%);
      padding: 6px 14px; border-radius: 20px; background: rgba(0,0,0,0.5);
      font-size: 14px; opacity: 0; transition: opacity 0.15s;
    }
    #toast.show { opacity: 1; }

    /* pickup prompt (aiming at a placed equippable item) */
    #pickup {
      left: 50%; top: calc(50% + 26px); transform: translateX(-50%);
      padding: 5px 14px; border-radius: 20px; background: rgba(0,0,0,0.55);
      border: 1px solid rgba(102,204,255,0.6); color: #bfe9ff; font-size: 14px;
      white-space: nowrap;
    }
    #pickup kbd {
      display: inline-block; min-width: 20px; padding: 0 5px; border: 1px solid #6cf;
      border-bottom-width: 2px; border-radius: 4px; background: rgba(0,0,0,0.4);
      font-family: inherit; font-size: 12px; color: #fff;
    }

    /* --- menus --- */
    .screen {
      position: fixed; inset: 0; z-index: 20; display: flex;
      align-items: center; justify-content: center; background: rgba(0,0,0,0.55);
      pointer-events: auto;
    }
    .screen.hidden { display: none; }
    .screen .box {
      background: rgba(14,17,22,0.96); border: 1px solid #333; border-radius: 12px;
      padding: 28px 34px; min-width: 340px; max-width: 90vw; text-align: center;
    }
    .screen h1 { font-size: 24px; margin-bottom: 6px; }
    .screen .sub { opacity: 0.7; font-size: 13px; margin-bottom: 20px; }
    .screen h2 { font-size: 14px; margin: 18px 0 8px; color: #fcb; text-align: left; }
    .screen button {
      display: block; width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #3a3f47;
      border-radius: 8px; background: rgba(30,36,44,0.9); color: #e8e8e8; cursor: pointer;
      font-size: 14px;
    }
    .screen button:hover:not(:disabled) { background: rgba(50,58,70,0.95); }
    .screen button:disabled { opacity: 0.4; cursor: default; }
    .screen button.primary { border-color: #6c9; background: rgba(60,110,80,0.5); }
    .screen button.primary:hover { background: rgba(70,130,95,0.7); }
    .screen .slot-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; text-align: left; }
    .screen .slot-row span { flex: 1; font-size: 13px; opacity: 0.9; }
    .screen .slot-row button { width: auto; margin: 0; padding: 6px 14px; }
    .screen .hint { margin-top: 18px; font-size: 12px; opacity: 0.6; line-height: 1.7; }
    .screen kbd {
      display: inline-block; min-width: 20px; padding: 0 5px; border: 1px solid #555;
      border-bottom-width: 2px; border-radius: 4px; background: #1a1c20; font-family: inherit; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="crosshair" class="overlay"></div>
  <div id="toast" class="overlay"></div>
  <div id="pickup" class="overlay hidden"></div>

  <div id="hud" class="overlay">
    <div class="panel">
      <div class="bar">
        <span class="bar-label">HP</span>
        <span class="bar-track"><span class="bar-fill health" id="health-fill"></span></span>
        <span class="bar-num" id="health-text">100</span>
      </div>
      <div class="bar">
        <span class="bar-label">AP</span>
        <span class="bar-track"><span class="bar-fill armor" id="armor-fill"></span></span>
        <span class="bar-num" id="armor-text">100</span>
      </div>
      <div id="equipment"></div>
      <div id="hand"></div>
      <div id="ammo" class="hidden"></div>
      <div class="row" style="margin-top:6px"><span class="label">Kills</span><span id="kills" class="value">0</span></div>
    </div>
  </div>

  <div id="menu" class="screen">
    <div class="box">
      <h1>Voxel Game</h1>
      <div class="sub">Your world, built in the editor</div>
      <button id="btn-new" class="primary">New Game</button>
      <h2>Load Game</h2>
      <div id="slots-menu"></div>
      <div class="hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp;·&nbsp;
        <kbd>Shift</kbd> sprint &nbsp;·&nbsp; <kbd>C</kbd> crouch &nbsp;·&nbsp;
        <kbd>LMB</kbd> attack &nbsp;·&nbsp; <kbd>1</kbd>-<kbd>4</kbd> select equipment &nbsp;·&nbsp;
        <kbd>R</kbd> reload &nbsp;·&nbsp; <kbd>F</kbd> use injection &nbsp;·&nbsp; <kbd>Esc</kbd> pause / save
      </div>
    </div>
  </div>

  <div id="pause" class="screen">
    <div class="box">
      <h1>Paused</h1>
      <div class="sub">Save or load a game slot</div>
      <button id="btn-resume" class="primary">Resume</button>
      <h2>Save / Load</h2>
      <div id="slots-pause"></div>
      <button id="btn-quit">Quit to Menu</button>
    </div>
  </div>

  <div id="death" class="screen hidden">
    <div class="box">
      <h1>You Died</h1>
      <div class="sub">The mobs got you this time</div>
      <button id="btn-respawn" class="primary">Respawn (New Game)</button>
      <button id="btn-death-menu">Main Menu</button>
    </div>
  </div>

  <script src="build/game-play.js"></script>
</body>
</html>
